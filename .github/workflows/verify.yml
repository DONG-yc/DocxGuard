name: Verify DocxGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore DocxGuard.sln --locked-mode
      - run: dotnet test DocxGuard.sln -c Release --no-restore
      - run: python -m pip install -r scripts/requirements-demo.txt
      - run: python scripts/eval-table-figure-templates.py
      - run: dotnet publish src/DocxGuard.Cli -c Release --no-restore -p:UseAppHost=false -o artifacts/release
      - run: python scripts/demo-release.py artifacts/release/DocxGuard.Cli.dll artifacts/demo
      - uses: actions/upload-artifact@v4
        with:
          name: docxguard-cli
          path: artifacts/release
